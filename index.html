<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Los Tigers Parfums y Más</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#090909;color:#f5f1e8}
header{background:#0b0b0b;border-bottom:1px solid #332817;padding:18px;text-align:center;color:#d7ad4b;font-weight:900;letter-spacing:2px}
.hero{padding:55px 20px;text-align:center;background:radial-gradient(circle,#3a2b11,#111 45%,#090909)}
.hero h1{font-size:clamp(48px,10vw,90px);margin:10px 0}
.hero p{color:#ccc}
section{max-width:1150px;margin:auto;padding:50px 20px}
h2{text-align:center;font-size:34px}
.filter-input{position:absolute;opacity:0;pointer-events:none}
.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:25px 0 35px}
.tabs label{border:1px solid #5b4924;background:#151515;color:#eee;padding:12px 20px;border-radius:25px;font-weight:800;cursor:pointer;user-select:none}
#cat-gorras:checked ~ .tabs label[for="cat-gorras"],
#cat-perfumes:checked ~ .tabs label[for="cat-perfumes"],
#cat-ropa:checked ~ .tabs label[for="cat-ropa"]{background:#d7ad4b;color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.product-card{background:#151515;border:1px solid #292929;border-radius:16px;overflow:hidden}
.product-card img{
  width:100%;
  height:320px;
  object-fit:contain;
  object-position:center;
  display:block;
  background:#fff;
  padding:16px;
}
.product-info{padding:18px}
.tag{color:#d7ad4b;font-size:11px;letter-spacing:2px}
.product-info h3{margin:8px 0}
.product-info a{display:block;text-align:center;background:#d7ad4b;color:#111;text-decoration:none;font-weight:900;padding:13px;border-radius:10px}
.empty{display:none;text-align:center;color:#bbb;padding:40px;font-size:18px}

/* Filtro SIN JavaScript */
#cat-gorras:checked ~ .grid .product-card:not(.gorras){display:none}
#cat-perfumes:checked ~ .grid .product-card:not(.perfumes){display:none}
#cat-ropa:checked ~ .grid .product-card{display:none}
#cat-ropa:checked ~ .empty{display:block}

.status{text-align:center;color:#bbb;padding:25px 10px;grid-column:1/-1}
footer{text-align:center;padding:28px;color:#777}
@media(max-width:650px){
  .product-card img{
    height:280px;
    object-fit:contain;
    object-position:center;
    background:#fff;
    padding:12px;
  }
}
</style>
</head>
<body>
<header>LOS TIGERS PARFUMS Y MÁS</header>
<div class="hero">
<h1>Los Tigers Parfums y Más</h1>
<p>Elige una categoría para ver solo sus productos.</p>
</div>
<section>
<h2>Categorías</h2>
<input checked="" class="filter-input" id="cat-gorras" name="cat" type="radio"/>
<input class="filter-input" id="cat-perfumes" name="cat" type="radio"/>
<input class="filter-input" id="cat-ropa" name="cat" type="radio"/>
<div class="tabs">
<label for="cat-gorras">Gorras</label>
<label for="cat-perfumes">Perfumes</label>
<label for="cat-ropa">Ropa</label>
</div>
<div class="grid" id="products-grid"></div>
<div class="empty" id="empty-message">No hay productos disponibles en esta categoría.</div>
</section>
<footer>© 2026 Los Tigers Parfums y Más · Tigers Boutique</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://nydlrezhitpqwimdzudq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_5yVVknnHCj1tdzBmA1Fyeg_FBImcFuf';
const STORAGE_BUCKET = 'productos';
const WHATSAPP_NUMBER = '34614335316';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const grid = document.getElementById('products-grid');
const emptyMessage = document.getElementById('empty-message');
const categoryInputs = [...document.querySelectorAll('input[name="cat"]')];

function escapeHtml(value='') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatPrice(price, currency='EUR') {
  if (price === null || price === undefined || price === '') return 'Consultar precio';
  try {
    return new Intl.NumberFormat('es-ES', { style: 'currency', currency }).format(Number(price));
  } catch {
    return `${price} ${currency || ''}`.trim();
  }
}

function imageUrl(path) {
  if (!path) return '';
  return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${encodeURIComponent(path).replaceAll('%2F','/')}`;
}

function whatsappUrl(product) {
  if (product.whatsapp_url) return product.whatsapp_url;
  const text = `Hola Tigers Boutique, quiero información sobre ${product.name}.`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`;
}

function selectedSlug() {
  return categoryInputs.find(i => i.checked)?.id.replace('cat-', '') || 'gorras';
}

function updateEmptyState() {
  const slug = selectedSlug();
  const visible = [...grid.querySelectorAll('.product-card')].filter(card => card.classList.contains(slug));
  emptyMessage.style.display = visible.length ? 'none' : 'block';
}

async function loadProducts() {
  grid.innerHTML = '<div class="status">Cargando productos…</div>';
  emptyMessage.style.display = 'none';

  const { data, error } = await supabaseClient
    .from('products')
    .select('id,name,price,currency,image_path,image_alt,is_available,is_active,sort_order,whatsapp_url,categories(name,slug)')
    .eq('is_active', true)
    .order('sort_order', { ascending: true })
    .order('name', { ascending: true });

  if (error) {
    console.error(error);
    grid.innerHTML = '<div class="status">No se pudo cargar el catálogo. Inténtalo de nuevo más tarde.</div>';
    return;
  }

  const products = (data || []).filter(p => p.categories?.slug);
  grid.innerHTML = products.map(product => {
    const slug = escapeHtml(product.categories.slug);
    const categoryName = escapeHtml(product.categories.name || slug).toUpperCase();
    const img = imageUrl(product.image_path);
    const availability = product.is_available ? '' : '<p style="color:#bbb">Agotado</p>';
    return `
      <article class="product-card ${slug}">
        ${img ? `<img src="${img}" alt="${escapeHtml(product.image_alt || product.name)}" loading="lazy">` : ''}
        <div class="product-info">
          <span class="tag">${categoryName}</span>
          <h3>${escapeHtml(product.name)}</h3>
          <p>${escapeHtml(formatPrice(product.price, product.currency))}</p>
          ${availability}
          <a href="${escapeHtml(whatsappUrl(product))}" rel="noopener" target="_blank">PEDIR POR WHATSAPP</a>
        </div>
      </article>`;
  }).join('');

  // Si la categoría seleccionada no tiene productos, selecciona automáticamente la primera que sí tenga.
  const current = selectedSlug();
  if (!products.some(p => p.categories.slug === current)) {
    const firstSlug = products[0]?.categories?.slug;
    const firstInput = firstSlug && document.getElementById(`cat-${firstSlug}`);
    if (firstInput) firstInput.checked = true;
  }
  updateEmptyState();
}

categoryInputs.forEach(input => input.addEventListener('change', updateEmptyState));
loadProducts();
</script>

</body>
</html>
