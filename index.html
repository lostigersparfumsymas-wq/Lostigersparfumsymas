<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Catálogo de Los Tigers Parfums y Más: gorras, perfumes, ropa y zapatillas.">
  <title>Los Tigers Parfums y Más</title>

  <style>
    :root{
      --bg:#090909;
      --panel:#151515;
      --border:#292929;
      --gold:#d7ad4b;
      --gold-dark:#5b4924;
      --text:#f5f1e8;
      --muted:#bdbdbd;
      --radius:16px;
      --max-width:1180px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Arial,Helvetica,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    body.modal-open{overflow:hidden}

    header{
      background:#0b0b0b;
      border-bottom:1px solid #332817;
      padding:12px 18px;
      color:var(--gold);
    }
    .brand{
      max-width:var(--max-width);
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .site-logo{
      width:96px;
      height:96px;
      display:block;
      object-fit:contain;
      flex:0 0 auto;
      filter:drop-shadow(0 4px 12px rgba(215,173,75,.22));
    }
    .brand-name{
      font-weight:900;
      letter-spacing:2px;
      text-align:left;
    }

    .hero{
      padding:52px 20px;
      text-align:center;
      background:radial-gradient(circle,#3a2b11,#111 45%,#090909);
    }
    .hero h1{
      margin:10px 0;
      font-size:clamp(42px,8vw,82px);
      line-height:1;
    }
    .hero p{margin:14px auto 0;color:#ccc;max-width:650px}

    main{max-width:var(--max-width);margin:auto;padding:44px 20px 64px}
    h2{text-align:center;font-size:34px;margin:0 0 18px}

    .tabs,.subtabs{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .tabs{margin:24px 0 12px}
    .subtabs{margin:0 0 34px;padding-top:8px}
    .tabs button,.subtabs button{
      border:1px solid var(--gold-dark);
      background:var(--panel);
      color:#eee;
      padding:12px 22px;
      border-radius:999px;
      font:inherit;
      font-weight:800;
      cursor:pointer;
      transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease;
    }
    .tabs button:hover,.subtabs button:hover{transform:translateY(-1px)}
    .tabs button.active,.subtabs button.active{
      background:var(--gold);
      border-color:var(--gold);
      color:#111;
    }
    .subtabs button{
      padding:10px 20px;
      background:#101010;
    }
    .subtabs::before{
      content:"Zapatillas";
      flex-basis:100%;
      text-align:center;
      color:var(--muted);
      font-size:13px;
      font-weight:700;
      letter-spacing:1px;
      text-transform:uppercase;
    }
    [hidden]{display:none!important}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
      gap:22px;
      align-items:stretch;
    }
    .product-card{
      display:flex;
      flex-direction:column;
      min-width:0;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 10px 24px rgba(0,0,0,.16);
    }
    .product-media{
      position:relative;
      width:100%;
      aspect-ratio:1/1;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
      overflow:hidden;
    }
    .product-media img{
      width:100%;
      height:100%;
      display:block;
      object-fit:contain;
      object-position:center;
      background:#fff;
      padding:16px;
      cursor:zoom-in;
      transition:transform .25s ease;
    }
    @media (hover:hover){.product-media img:hover{transform:scale(1.04)}}

    .product-info{
      display:flex;
      flex:1;
      flex-direction:column;
      padding:18px;
    }
    .tag{
      color:var(--gold);
      font-size:11px;
      font-weight:800;
      letter-spacing:2px;
    }
    .product-info h3{margin:8px 0 10px;font-size:20px;line-height:1.2}
    .price{margin:0 0 14px}
    .availability{margin:0 0 14px;color:var(--muted)}
    .product-info a{
      display:block;
      margin-top:auto;
      text-align:center;
      background:var(--gold);
      color:#111;
      text-decoration:none;
      font-weight:900;
      padding:14px 12px;
      border-radius:11px;
    }
    .product-info a:hover{filter:brightness(1.05)}

    .status,.empty{
      text-align:center;
      color:var(--muted);
      padding:40px 10px;
      grid-column:1/-1;
    }
    .empty{display:none}

    footer{
      border-top:1px solid #1c1c1c;
      text-align:center;
      padding:28px 18px;
      color:#777;
    }

    .image-zoom{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(0,0,0,.93);
      backdrop-filter:blur(3px);
    }
    .image-zoom.open{display:flex}
    .image-zoom__frame{
      width:min(94vw,1100px);
      height:min(90vh,900px);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .image-zoom img{
      display:block;
      width:auto;
      height:auto;
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      background:#fff;
      border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,.65);
    }
    .image-zoom button{
      position:fixed;
      top:16px;
      right:16px;
      z-index:10000;
      width:48px;
      height:48px;
      border:0;
      border-radius:50%;
      background:var(--gold);
      color:#111;
      font-size:30px;
      line-height:1;
      font-weight:900;
      cursor:pointer;
    }

    @media(max-width:650px){
      header{padding:9px 10px}
      .brand{gap:8px}
      .site-logo{width:72px;height:72px}
      .brand-name{font-size:13px;letter-spacing:1.2px}
      .hero{padding:40px 16px}
      .hero h1{font-size:clamp(38px,13vw,60px)}
      main{padding:34px 14px 50px}
      h2{font-size:30px}
      .tabs button{padding:11px 16px}
      .subtabs button{padding:10px 18px}
      .grid{grid-template-columns:1fr;gap:18px}
      .product-media{aspect-ratio:1/1}
      .product-media img{padding:14px}
      .product-info h3{font-size:22px}
      .image-zoom{padding:10px}
      .image-zoom__frame{width:96vw;height:86vh}
      .image-zoom button{top:10px;right:10px}
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img class="site-logo" src="logo-los-tigers.webp" width="96" height="96" alt="Logo de Los Tigers Parfums y Más">
      <span class="brand-name">LOS TIGERS PARFUMS Y MÁS</span>
    </div>
  </header>

  <section class="hero" aria-labelledby="site-title">
    <h1 id="site-title">Los Tigers Parfums y Más</h1>
    <p>Elige una categoría para ver los productos disponibles.</p>
  </section>

  <main>
    <h2>Categorías</h2>

    <nav class="tabs" aria-label="Categorías del catálogo">
      <button class="active" type="button" data-category="gorras">Gorras</button>
      <button type="button" data-category="perfumes">Perfumes</button>
      <button type="button" data-category="ropa">Ropa</button>
      <button type="button" data-category="zapatillas" id="shoes-toggle" aria-expanded="false">Zapatillas</button>
    </nav>

    <nav class="subtabs" id="shoes-subcategories" aria-label="Zapatillas por género" hidden>
      <button type="button" data-category="zapatillas-hombre">Hombre</button>
      <button type="button" data-category="zapatillas-mujer">Mujer</button>
    </nav>

    <section class="grid" id="products-grid" aria-live="polite"></section>
    <div class="empty" id="empty-message">No hay productos disponibles en esta categoría.</div>
  </main>

  <footer>© 2026 Los Tigers Parfums y Más · Tigers Boutique</footer>

  <div class="image-zoom" id="image-zoom" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Vista ampliada del producto">
    <button id="image-zoom-close" type="button" aria-label="Cerrar imagen ampliada">×</button>
    <div class="image-zoom__frame">
      <img id="image-zoom-img" alt="Vista ampliada del producto">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const CONFIG = {
      supabaseUrl: 'https://nydlrezhitpqwimdzudq.supabase.co',
      supabasePublishableKey: 'sb_publishable_5yVVknnHCj1tdzBmA1Fyeg_FBImcFuf',
      storageBucket: 'productos',
      whatsappNumber: '34614335316'
    };

    const supabaseClient = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabasePublishableKey);
    const grid = document.getElementById('products-grid');
    const emptyMessage = document.getElementById('empty-message');
    const topButtons = [...document.querySelectorAll('.tabs button[data-category]')];
    const shoeButtons = [...document.querySelectorAll('.subtabs button[data-category]')];
    const shoesToggle = document.getElementById('shoes-toggle');
    const shoesSubcategories = document.getElementById('shoes-subcategories');
    const zoom = document.getElementById('image-zoom');
    const zoomImg = document.getElementById('image-zoom-img');
    const zoomClose = document.getElementById('image-zoom-close');
    let selectedCategory = 'gorras';

    function escapeHtml(value = '') {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatPrice(price, currency = 'EUR') {
      if (price === null || price === undefined || price === '') return 'Consultar precio';
      try {
        return new Intl.NumberFormat('es-ES', {
          style: 'currency',
          currency: currency || 'EUR'
        }).format(Number(price));
      } catch {
        return `${price} ${currency || ''}`.trim();
      }
    }

    function imageUrl(path) {
      if (!path) return '';
      if (/^https?:\/\//i.test(path)) return path;
      const { data } = supabaseClient.storage.from(CONFIG.storageBucket).getPublicUrl(path);
      return data?.publicUrl || '';
    }

    function whatsappUrl(product) {
      if (product.whatsapp_url) return product.whatsapp_url;
      const text = `Hola Tigers Boutique, quiero información sobre ${product.name}.`;
      return `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
    }

    function updateNavigation() {
      const shoesSelected = selectedCategory.startsWith('zapatillas-');
      topButtons.forEach(button => {
        const category = button.dataset.category;
        const active = category === 'zapatillas' ? shoesSelected : category === selectedCategory;
        button.classList.toggle('active', active);
      });
      shoeButtons.forEach(button => button.classList.toggle('active', button.dataset.category === selectedCategory));
      shoesSubcategories.hidden = !shoesSelected;
      shoesToggle.setAttribute('aria-expanded', String(shoesSelected));
    }

    function applyFilter() {
      const cards = [...grid.querySelectorAll('.product-card')];
      let visible = 0;
      cards.forEach(card => {
        const show = card.dataset.category === selectedCategory;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      emptyMessage.style.display = visible ? 'none' : 'block';
      updateNavigation();
    }

    function selectCategory(category) {
      selectedCategory = category === 'zapatillas' ? 'zapatillas-hombre' : category;
      applyFilter();
    }

    function openZoom(src, alt = 'Producto') {
      if (!src) return;
      zoomImg.src = src;
      zoomImg.alt = alt;
      zoom.classList.add('open');
      zoom.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      zoomClose.focus();
    }

    function closeZoom() {
      zoom.classList.remove('open');
      zoom.setAttribute('aria-hidden', 'true');
      zoomImg.src = '';
      document.body.classList.remove('modal-open');
    }

    function productCard(product) {
      const slug = escapeHtml(product.categories.slug);
      const categoryName = escapeHtml(product.categories.name || slug).toUpperCase();
      const name = escapeHtml(product.name);
      const img = imageUrl(product.image_path);
      const alt = escapeHtml(product.image_alt || product.name);
      const price = escapeHtml(formatPrice(product.price, product.currency));
      const orderUrl = escapeHtml(whatsappUrl(product));
      const availability = product.is_available ? '' : '<p class="availability">Agotado</p>';

      return `
        <article class="product-card" data-category="${slug}" data-product-id="${product.id}">
          <div class="product-media">
            ${img ? `<img src="${img}" alt="${alt}" loading="lazy" decoding="async">` : '<span class="status">Sin imagen</span>'}
          </div>
          <div class="product-info">
            <span class="tag">${categoryName}</span>
            <h3>${name}</h3>
            <p class="price">${price}</p>
            ${availability}
            <a href="${orderUrl}" rel="noopener" target="_blank">PEDIR POR WHATSAPP</a>
          </div>
        </article>`;
    }

    async function loadProducts() {
      grid.innerHTML = '<div class="status">Cargando productos…</div>';
      emptyMessage.style.display = 'none';

      const { data, error } = await supabaseClient
        .from('products')
        .select('id,name,price,currency,image_path,image_alt,is_available,is_active,sort_order,whatsapp_url,categories(name,slug)')
        .eq('is_active', true)
        .order('sort_order', { ascending: true })
        .order('name', { ascending: true });

      if (error) {
        console.error('Error cargando catálogo:', error);
        grid.innerHTML = '<div class="status">No se pudo cargar el catálogo. Inténtalo de nuevo más tarde.</div>';
        return;
      }

      const products = (data || []).filter(product => product.categories?.slug);
      grid.innerHTML = products.map(productCard).join('');
      applyFilter();
    }

    topButtons.forEach(button => button.addEventListener('click', () => selectCategory(button.dataset.category)));
    shoeButtons.forEach(button => button.addEventListener('click', () => selectCategory(button.dataset.category)));

    zoomClose.addEventListener('click', closeZoom);
    zoom.addEventListener('click', event => { if (event.target === zoom) closeZoom(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && zoom.classList.contains('open')) closeZoom(); });
    grid.addEventListener('click', event => {
      const img = event.target.closest('.product-media img');
      if (img) openZoom(img.src, img.alt);
    });

    loadProducts();
  </script>
</body>
</html>
